name: Build patched mod

on:
  push:
    branches: ['1.21.1Fabric']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Extract and apply fix bundle
        shell: bash
        run: |
          set -eu
          BUNDLE=$(ls fox-fix-bundle*.zip 2>/dev/null | head -n1 || true)
          test -n "$BUNDLE" || { echo "::error::fox-fix-bundle.zip tidak ada di root repo"; exit 1; }
          unzip -p "$BUNDLE" apply-fix.sh > /tmp/apply-fix.sh
          bash /tmp/apply-fix.sh "$BUNDLE"

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon --console=plain
        env:
          CI: 'true'

      - name: Unit tests (tidak memblokir)
        continue-on-error: true
        run: ./gradlew :fabric:test --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fox-model-loader-patched
          path: |
            fabric/build/libs/fox-model-loader-revival-*-fa*.jar
            !fabric/build/libs/*-dev-shadow.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload ke GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          JAR=$(ls fabric/build/libs/fox-model-loader-revival-*-fa*.jar | grep -v -e dev-shadow -e sources | head -n1)
          test -n "$JAR" || { echo "::error::jar tidak ditemukan"; exit 1; }
          TAG="patched-${{ github.run_number }}"
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Patched build #${{ github.run_number }}" \
            --notes "Build otomatis: poly_mesh + shading halus + mode hemat RAM. Commit ${GITHUB_SHA::7}."
          echo "Rilis dibuat: $TAG"

      - name: Simpan source yang sudah ter-patch ke branch
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A common fabric
          if git diff --cached --quiet; then echo "tidak ada perubahan"; else
            git commit -m "Apply poly_mesh + low-RAM fixes [skip ci]"
            git push
          fi
